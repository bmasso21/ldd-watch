name: Weekly FDA approval check

on:
  schedule:
    - cron: "17 12 * * 1"   # Mondays 12:17 UTC (8:17 AM ET)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query openFDA
        id: fda
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}   # optional
        run: |
          python scripts/check_fda_approvals.py --days 21 > report.md
          if grep -q NO_NEW_APPROVALS report.md; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue
        if: steps.fda.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "LDD research: new approvals $(date -u +%Y-%m-%d)" \
            --label research \
            --body-file report.md

      - name: Persist seen-state
        run: |
          git config user.name "ldd-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .fda_seen.json || true
          git diff --cached --quiet || (git commit -m "chore: update seen approvals" && git push)
